<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elite Trader AI Mentor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 2rem;
      color: #58a6ff;
      letter-spacing: 1px;
    }

    header p {
      color: #8b949e;
      margin-top: 6px;
      font-size: 0.95rem;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 720px;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 1rem;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    /* Upload zone */
    #drop-zone {
      border: 2px dashed #30363d;
      border-radius: 10px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    #drop-zone:hover, #drop-zone.dragover {
      border-color: #58a6ff;
      background: #1c2128;
    }

    #drop-zone p { color: #8b949e; font-size: 0.9rem; margin-top: 8px; }
    #drop-zone .icon { font-size: 2.5rem; }

    #file-input { display: none; }

    #preview-wrap { margin-top: 16px; display: none; }
    #preview-wrap img {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #30363d;
    }

    /* Button */
    .btn {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 28px;
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }

    .btn:hover { background: #2ea043; }
    .btn:disabled { background: #21262d; color: #6e7681; cursor: not-allowed; }

    /* Analysis output */
    #analysis-box {
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 0.95rem;
      color: #e6edf3;
      min-height: 60px;
    }

    .tag-buy   { color: #3fb950; font-weight: bold; }
    .tag-sell  { color: #f85149; font-weight: bold; }
    .tag-hold  { color: #d29922; font-weight: bold; }

    /* Chat */
    #chat-section { display: none; }

    #chat-log {
      max-height: 320px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .msg {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      line-height: 1.6;
      max-width: 90%;
    }

    .msg.user {
      background: #1f6feb;
      align-self: flex-end;
      color: #fff;
    }

    .msg.ai {
      background: #21262d;
      border: 1px solid #30363d;
      align-self: flex-start;
      white-space: pre-wrap;
    }

    .chat-input-row {
      display: flex;
      gap: 10px;
    }

    #user-input {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      padding: 10px 14px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #user-input:focus { border-color: #58a6ff; }

    .send-btn {
      padding: 10px 20px;
      background: #1f6feb;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    .send-btn:hover { background: #388bfd; }
    .send-btn:disabled { background: #21262d; color: #6e7681; cursor: not-allowed; }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      color: #484f58;
      font-size: 0.8rem;
      margin-top: 24px;
    }
  </style>
</head>
<body>

  <header>
    <h1>📈 Elite Trader AI Mentor</h1>
    <p>Upload a chart screenshot — Claude will analyze it and answer your questions.</p>
  </header>

  <!-- Upload card -->
  <div class="card">
    <h2>1. Upload Your Chart</h2>
    <div id="drop-zone" onclick="document.getElementById('file-input').click()">
      <div class="icon">🖼️</div>
      <strong>Click to upload or drag & drop</strong>
      <p>PNG, JPG, WEBP supported</p>
    </div>
    <input type="file" id="file-input" accept="image/*" />
    <div id="preview-wrap"><img id="preview" src="" alt="Chart preview" /></div>
    <button class="btn" id="analyze-btn" disabled>🔍 Analyze Chart</button>
  </div>

  <!-- Analysis card -->
  <div class="card" id="analysis-card" style="display:none">
    <h2>2. AI Analysis</h2>
    <div id="analysis-box"></div>
  </div>

  <!-- Chat card -->
  <div class="card" id="chat-section">
    <h2>3. Ask Me Anything</h2>
    <div id="chat-log"></div>
    <div class="chat-input-row">
      <input type="text" id="user-input" placeholder="e.g. Why did you say HOLD?" />
      <button class="send-btn" id="send-btn">Send</button>
    </div>
  </div>

  <footer>Powered by Claude AI · Elite Trader Mentor</footer>

  <script>
    let imageFile = null;
    let conversationHistory = [];

    const dropZone   = document.getElementById('drop-zone');
    const fileInput  = document.getElementById('file-input');
    const previewWrap = document.getElementById('preview-wrap');
    const preview    = document.getElementById('preview');
    const analyzeBtn = document.getElementById('analyze-btn');
    const analysisCard = document.getElementById('analysis-card');
    const analysisBox = document.getElementById('analysis-box');
    const chatSection = document.getElementById('chat-section');
    const chatLog    = document.getElementById('chat-log');
    const userInput  = document.getElementById('user-input');
    const sendBtn    = document.getElementById('send-btn');

    // Drag-and-drop
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) loadFile(fileInput.files[0]);
    });

    function loadFile(file) {
      imageFile = file;
      const url = URL.createObjectURL(file);
      preview.src = url;
      previewWrap.style.display = 'block';
      analyzeBtn.disabled = false;
      analyzeBtn.textContent = '🔍 Analyze Chart';
      conversationHistory = [];
      chatSection.style.display = 'none';
      analysisCard.style.display = 'none';
      chatLog.innerHTML = '';
    }

    analyzeBtn.addEventListener('click', async () => {
      if (!imageFile) return;

      analyzeBtn.disabled = true;
      analyzeBtn.innerHTML = '<span class="spinner"></span>Analyzing...';
      analysisCard.style.display = 'block';
      analysisBox.innerHTML = '<span class="spinner"></span> Claude is reading your chart...';

      const formData = new FormData();
      formData.append('image', imageFile);

      try {
        const res = await fetch('/api/analyze', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.error) {
          analysisBox.innerHTML = `<span style="color:#f85149">Error: ${data.error}</span>`;
        } else {
          const text = data.response;
          analysisBox.innerHTML = colorize(text);

          // Seed conversation history with image + analysis
          conversationHistory = [
            {
              role: 'user',
              content: [
                { type: 'image', source: { type: 'base64', media_type: imageFile.type, data: await toBase64(imageFile) } },
                { type: 'text', text: 'Please analyze this chart and give me your trading recommendation.' }
              ]
            },
            { role: 'assistant', content: text }
          ];

          chatSection.style.display = 'block';
          addMessage('ai', text);
        }
      } catch (e) {
        analysisBox.innerHTML = `<span style="color:#f85149">Network error: ${e.message}</span>`;
      }

      analyzeBtn.disabled = false;
      analyzeBtn.innerHTML = '🔄 Re-analyze';
    });

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

    async function sendMessage() {
      const q = userInput.value.trim();
      if (!q || conversationHistory.length === 0) return;

      addMessage('user', q);
      userInput.value = '';
      sendBtn.disabled = true;

      const typingEl = addMessage('ai', '<span class="spinner"></span> Thinking...');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ history: conversationHistory, question: q })
        });
        const data = await res.json();

        if (data.error) {
          typingEl.innerHTML = `<span style="color:#f85149">Error: ${data.error}</span>`;
        } else {
          typingEl.innerHTML = colorize(data.response);
          conversationHistory.push({ role: 'user', content: q });
          conversationHistory.push({ role: 'assistant', content: data.response });
        }
      } catch (e) {
        typingEl.innerHTML = `<span style="color:#f85149">Network error: ${e.message}</span>`;
      }

      sendBtn.disabled = false;
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function addMessage(role, html) {
      const el = document.createElement('div');
      el.className = `msg ${role}`;
      el.innerHTML = html;
      chatLog.appendChild(el);
      chatLog.scrollTop = chatLog.scrollHeight;
      return el;
    }

    function colorize(text) {
      return text
        .replace(/\bBUY\b/g, '<span class="tag-buy">BUY</span>')
        .replace(/\bSELL\b/g, '<span class="tag-sell">SELL</span>')
        .replace(/\bHOLD\b/g, '<span class="tag-hold">HOLD</span>');
    }

    async function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
  </script>
</body>
</html>
